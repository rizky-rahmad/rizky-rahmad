<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" width="640" height="160" role="img" aria-label="Rahmad Rizki, full-stack developer building AI products. PT Unicorn since June 2026, coding since 2024, Ubud, Bali. Open to work.">
  <style>
    .h-t{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
    .h-line{stroke-dasharray:240;stroke-dashoffset:240;animation:h-draw 1.2s .3s ease-out forwards}
    .h-pulse{transform-origin:492px 47px;animation:h-pulse 2s ease-out infinite}
    @keyframes h-draw{to{stroke-dashoffset:0}}
    @keyframes h-pulse{0%{transform:scale(1);opacity:.6}100%{transform:scale(3);opacity:0}}
    @media (prefers-reduced-motion:reduce){.h-line{animation:none;stroke-dashoffset:0}.h-pulse{animation:none}}
  </style>
  <rect width="640" height="160" rx="16" fill="#0d1520" stroke="#1e2a38"/>
  <text x="28" y="60" class="h-t" font-size="36" font-weight="700" fill="#f8fafc">Rahmad Rizki</text>
  <line x1="28" y1="76" x2="268" y2="76" stroke="#2dd4bf" stroke-width="3" stroke-linecap="round" class="h-line"/>
  <text x="28" y="108" class="h-t" font-size="19" fill="#2dd4bf">Full-stack developer · I build AI products</text>
  <text x="28" y="138" class="h-t" font-size="15" fill="#94a3b8">PT Unicorn since Jun 2026 · coding since 2024 · Ubud, Bali</text>
  <rect x="474" y="30" width="138" height="34" rx="17" fill="#0f2a1c" stroke="#22c55e" stroke-opacity=".6"/>
  <circle cx="492" cy="47" r="5" fill="#22c55e" class="h-pulse"/>
  <circle cx="492" cy="47" r="5" fill="#22c55e"/>
  <text x="506" y="52" class="h-t" font-size="14" font-weight="600" fill="#86efac">Open to work</text>
</svg>
