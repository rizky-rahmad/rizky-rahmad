<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 150" width="640" height="150" role="img" aria-label="Rahmad Rizki, full-stack developer building AI systems in production at PT Unicorn, Ubud, Bali">
  <style>
    .h-t{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
    .h-line{stroke-dasharray:240;stroke-dashoffset:240;animation:h-draw 1.2s .3s ease-out forwards}
    .h-pulse{transform-origin:574px 50px;animation:h-pulse 2s ease-out infinite}
    @keyframes h-draw{to{stroke-dashoffset:0}}
    @keyframes h-pulse{0%{transform:scale(1);opacity:.6}100%{transform:scale(3);opacity:0}}
    @media (prefers-reduced-motion:reduce){.h-line{animation:none;stroke-dashoffset:0}.h-pulse{animation:none}}
  </style>
  <rect width="640" height="150" rx="16" fill="#0d1520" stroke="#1e2a38"/>
  <text x="28" y="60" class="h-t" font-size="36" font-weight="700" fill="#f8fafc">Rahmad Rizki</text>
  <line x1="28" y1="76" x2="268" y2="76" stroke="#2dd4bf" stroke-width="3" stroke-linecap="round" class="h-line"/>
  <text x="28" y="106" class="h-t" font-size="19" fill="#2dd4bf">Full-stack developer · AI in production</text>
  <text x="28" y="132" class="h-t" font-size="15" fill="#94a3b8">PT Unicorn · Ubud, Bali</text>
  <circle cx="574" cy="50" r="5" fill="#22c55e" class="h-pulse"/>
  <circle cx="574" cy="50" r="5" fill="#22c55e"/>
  <text x="586" y="55" class="h-t" font-size="14" fill="#cbd5e1">live</text>
</svg>
