<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 210" width="580" height="210" role="img" aria-label="CMS plus page builder: Multi-tenant CMS with a free-form drag-and-drop builder serving many brands from one deploy.">
  <title>CMS + page builder</title>
  <defs>
    <linearGradient id="bg6" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#0a1414"/>
    </linearGradient>
    <linearGradient id="chip6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#132028"/>
      <stop offset="100%" stop-color="#0c161b"/>
    </linearGradient>
    <linearGradient id="beam6" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0"/>
      <stop offset="50%" stop-color="#2dd4bf" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </linearGradient>
    <pattern id="g6" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#2dd4bf" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <clipPath id="c6"><rect width="580" height="210" rx="13"/></clipPath>
    <style>
      /* Blocks drop onto the canvas one after another — the builder's
         palette-to-canvas gesture, abstracted. */
      .beam { animation: beam 16s ease-in-out infinite; animation-delay: 10.0s; }
      .edge { animation: edge 16s ease-in-out infinite; animation-delay: 10.0s; }
      .rail { animation: rail 16s ease-in-out infinite; animation-delay: 10.0s; }
      .live { animation: live 2.6s ease-in-out infinite; }
      .drop { animation: drop 2.7s ease-in-out infinite; }
      .d1 { animation-delay: 0s; } .d2 { animation-delay: 0.45s; } .d3 { animation-delay: 0.9s; }

      @keyframes beam { 0% { transform: translateX(-240px); opacity: 0; }
                        4% { opacity: 1; }
                        22% { transform: translateX(580px); opacity: 0; }
                        100% { transform: translateX(580px); opacity: 0; } }
      @keyframes edge { 0%,100% { stroke: #1c3333; } 10% { stroke: #2dd4bf; } 24% { stroke: #1c3333; } }
      @keyframes rail { 0%,100% { opacity: .5; } 10% { opacity: 1; } 24% { opacity: .5; } }
      @keyframes live { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
      @keyframes drop { 0%,100% { transform: translateY(-7px); opacity: .35; }
                        40% { transform: translateY(0); opacity: 1; }
                        70% { transform: translateY(0); opacity: 1; } }

      @media (prefers-reduced-motion: reduce) {
        .beam { display: none; }
        .edge, .rail, .live, .drop { animation: none; }
      }
    </style>
  </defs>

  <g clip-path="url(#c6)">
    <rect width="580" height="210" fill="url(#bg6)"/>
    <rect width="580" height="210" fill="url(#g6)"/>
    <g class="beam"><rect x="0" y="0" width="240" height="210" fill="url(#beam6)"/></g>

    <text x="28" y="46" font-family="Inter,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="21" font-weight="700" fill="#e6f6f4">CMS + page builder</text>

    <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#a9cfcb">
      <text x="28" y="80">Multi-tenant CMS with a free-form builder —</text>
      <text x="28" y="100">many brands, one deploy, served locally.</text>
    </g>

    <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5"><g transform="translate(28, 122)"><rect width="78" height="26" rx="7" fill="url(#chip6)" stroke="#1c3333"/><text x="39.0" y="17" text-anchor="middle" fill="#cfe9e6">Next.js</text></g><g transform="translate(116, 122)"><rect width="72" height="26" rx="7" fill="url(#chip6)" stroke="#1c3333"/><text x="36.0" y="17" text-anchor="middle" fill="#cfe9e6">Prisma</text></g><g transform="translate(198, 122)"><rect width="78" height="26" rx="7" fill="url(#chip6)" stroke="#1c3333"/><text x="39.0" y="17" text-anchor="middle" fill="#cfe9e6">dnd-kit</text></g></g>

    <g fill="none" stroke="#2dd4bf" stroke-width="2">
      <rect class="drop d1" x="466" y="34" width="84" height="12" rx="3"/>
      <rect class="drop d2" x="478" y="52" width="60" height="12" rx="3"/>
      <rect class="drop d3" x="466" y="70" width="84" height="12" rx="3"/>
    </g>

    <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12">
      <circle cx="34" cy="180" r="4" fill="#2dd4bf" class="live"/>
      <text x="48" y="184" fill="#7fe9dc">47 block families</text>
      <text x="552" y="184" text-anchor="end" fill="#7ba3a0">in production</text>
    </g>

    <rect x="0.5" y="0.5" width="579" height="209" rx="13" fill="none" stroke="#1c3333" stroke-width="1" class="edge"/>
    <rect x="0" y="0" width="3" height="210" fill="#2dd4bf" class="rail"/>
  </g>
</svg>
