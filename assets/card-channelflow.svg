<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 210" width="580" height="210" role="img" aria-label="Channelflow: One inbox for WhatsApp, Instagram, Email and TikTok, with a grounded AI agent that answers, books, and hands off to humans.">
  <title>Channelflow</title>
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#0a1414"/>
    </linearGradient>
    <linearGradient id="chip4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#132028"/>
      <stop offset="100%" stop-color="#0c161b"/>
    </linearGradient>
    <linearGradient id="beam4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0"/>
      <stop offset="50%" stop-color="#2dd4bf" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </linearGradient>
    <pattern id="g4" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#2dd4bf" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <clipPath id="c4"><rect width="580" height="210" rx="13"/></clipPath>
    <style>
      /* The sweep takes its turn between the older cards; the typing dots are
         the AI agent mid-reply — the product's signature moment. */
      .beam { animation: beam 16s ease-in-out infinite; animation-delay: 2.0s; }
      .edge { animation: edge 16s ease-in-out infinite; animation-delay: 2.0s; }
      .rail { animation: rail 16s ease-in-out infinite; animation-delay: 2.0s; }
      .live { animation: live 2.6s ease-in-out infinite; }
      .tp1 { animation: tp 1.8s ease-in-out infinite; animation-delay: 0s; }
      .tp2 { animation: tp 1.8s ease-in-out infinite; animation-delay: 0.25s; }
      .tp3 { animation: tp 1.8s ease-in-out infinite; animation-delay: 0.5s; }

      @keyframes beam { 0% { transform: translateX(-240px); opacity: 0; }
                        4% { opacity: 1; }
                        22% { transform: translateX(580px); opacity: 0; }
                        100% { transform: translateX(580px); opacity: 0; } }
      @keyframes edge { 0%,100% { stroke: #1c3333; } 10% { stroke: #2dd4bf; } 24% { stroke: #1c3333; } }
      @keyframes rail { 0%,100% { opacity: .5; } 10% { opacity: 1; } 24% { opacity: .5; } }
      @keyframes live { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
      @keyframes tp { 0%,100% { opacity: .2; } 30% { opacity: 1; } 60% { opacity: .2; } }

      @media (prefers-reduced-motion: reduce) {
        .beam { display: none; }
        .edge, .rail, .live, .tp1, .tp2, .tp3 { animation: none; }
      }
    </style>
  </defs>

  <g clip-path="url(#c4)">
    <rect width="580" height="210" fill="url(#bg4)"/>
    <rect width="580" height="210" fill="url(#g4)"/>
    <g class="beam"><rect x="0" y="0" width="240" height="210" fill="url(#beam4)"/></g>

    <text x="28" y="46" font-family="Inter,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="21" font-weight="700" fill="#e6f6f4">Channelflow</text>

    <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#a9cfcb">
      <text x="28" y="80">WA, IG, Email, TikTok in one inbox — with a</text>
      <text x="28" y="100">grounded AI agent that answers and books.</text>
    </g>

    <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5"><g transform="translate(28, 122)"><rect width="78" height="26" rx="7" fill="url(#chip4)" stroke="#1c3333"/><text x="39.0" y="17" text-anchor="middle" fill="#cfe9e6">Next.js</text></g><g transform="translate(116, 122)"><rect width="72" height="26" rx="7" fill="url(#chip4)" stroke="#1c3333"/><text x="36.0" y="17" text-anchor="middle" fill="#cfe9e6">Mastra</text></g><g transform="translate(198, 122)"><rect width="78" height="26" rx="7" fill="url(#chip4)" stroke="#1c3333"/><text x="39.0" y="17" text-anchor="middle" fill="#cfe9e6">Hono.js</text></g></g>

    <g>
      <rect x="452" y="30" width="100" height="52" rx="12" fill="none" stroke="#1c3333"/>
      <circle cx="482" cy="56" r="5" fill="#2dd4bf" class="tp1"/>
      <circle cx="502" cy="56" r="5" fill="#2dd4bf" class="tp2"/>
      <circle cx="522" cy="56" r="5" fill="#2dd4bf" class="tp3"/>
    </g>

    <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12">
      <circle cx="34" cy="180" r="4" fill="#2dd4bf" class="live"/>
      <text x="48" y="184" fill="#7fe9dc">inbox · AI agent · bookings</text>
      <text x="552" y="184" text-anchor="end" fill="#7ba3a0">in production</text>
    </g>

    <rect x="0.5" y="0.5" width="579" height="209" rx="13" fill="none" stroke="#1c3333" stroke-width="1" class="edge"/>
    <rect x="0" y="0" width="3" height="210" fill="#2dd4bf" class="rail"/>
  </g>
</svg>
