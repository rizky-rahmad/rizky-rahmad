<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 210" width="580" height="210" role="img" aria-label="Channelflow Mobile: Staff bookings on Android — list, day timeline, month view and analytics, at parity with the dashboard.">
  <title>Channelflow Mobile</title>
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#0a1414"/>
    </linearGradient>
    <linearGradient id="chip5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#132028"/>
      <stop offset="100%" stop-color="#0c161b"/>
    </linearGradient>
    <linearGradient id="beam5" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0"/>
      <stop offset="50%" stop-color="#2dd4bf" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </linearGradient>
    <pattern id="g5" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#2dd4bf" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <clipPath id="c5"><rect width="580" height="210" rx="13"/></clipPath>
    <style>
      /* Rising bars: the day filling up with bookings — what the timeline
         screen is for. Each bar takes its turn on a staggered loop. */
      .beam { animation: beam 16s ease-in-out infinite; animation-delay: 6.0s; }
      .edge { animation: edge 16s ease-in-out infinite; animation-delay: 6.0s; }
      .rail { animation: rail 16s ease-in-out infinite; animation-delay: 6.0s; }
      .live { animation: live 2.6s ease-in-out infinite; }
      .bar { transform-box: fill-box; transform-origin: bottom; animation: bar 2.4s ease-in-out infinite; }
      .b1 { animation-delay: 0s; } .b2 { animation-delay: 0.3s; }
      .b3 { animation-delay: 0.6s; } .b4 { animation-delay: 0.9s; }

      @keyframes beam { 0% { transform: translateX(-240px); opacity: 0; }
                        4% { opacity: 1; }
                        22% { transform: translateX(580px); opacity: 0; }
                        100% { transform: translateX(580px); opacity: 0; } }
      @keyframes edge { 0%,100% { stroke: #1c3333; } 10% { stroke: #2dd4bf; } 24% { stroke: #1c3333; } }
      @keyframes rail { 0%,100% { opacity: .5; } 10% { opacity: 1; } 24% { opacity: .5; } }
      @keyframes live { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
      @keyframes bar { 0%,100% { transform: scaleY(0.35); opacity: .45; } 50% { transform: scaleY(1); opacity: 1; } }

      @media (prefers-reduced-motion: reduce) {
        .beam { display: none; }
        .edge, .rail, .live, .bar { animation: none; }
      }
    </style>
  </defs>

  <g clip-path="url(#c5)">
    <rect width="580" height="210" fill="url(#bg5)"/>
    <rect width="580" height="210" fill="url(#g5)"/>
    <g class="beam"><rect x="0" y="0" width="240" height="210" fill="url(#beam5)"/></g>

    <text x="28" y="46" font-family="Inter,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="21" font-weight="700" fill="#e6f6f4">Channelflow Mobile</text>

    <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#a9cfcb">
      <text x="28" y="80">Staff bookings on Android — list, day and</text>
      <text x="28" y="100">month views at parity with the dashboard.</text>
    </g>

    <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5"><g transform="translate(28, 122)"><rect width="58" height="26" rx="7" fill="url(#chip5)" stroke="#1c3333"/><text x="29.0" y="17" text-anchor="middle" fill="#cfe9e6">Expo</text></g><g transform="translate(96, 122)"><rect width="114" height="26" rx="7" fill="url(#chip5)" stroke="#1c3333"/><text x="57.0" y="17" text-anchor="middle" fill="#cfe9e6">React Native</text></g><g transform="translate(220, 122)"><rect width="100" height="26" rx="7" fill="url(#chip5)" stroke="#1c3333"/><text x="50.0" y="17" text-anchor="middle" fill="#cfe9e6">TypeScript</text></g></g>

    <g fill="#2dd4bf">
      <rect class="bar b1" x="462" y="38" width="12" height="44" rx="3"/>
      <rect class="bar b2" x="480" y="38" width="12" height="44" rx="3"/>
      <rect class="bar b3" x="498" y="38" width="12" height="44" rx="3"/>
      <rect class="bar b4" x="516" y="38" width="12" height="44" rx="3"/>
    </g>

    <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12">
      <circle cx="34" cy="180" r="4" fill="#2dd4bf" class="live"/>
      <text x="48" y="184" fill="#7fe9dc">verified on emulator</text>
      <text x="552" y="184" text-anchor="end" fill="#7ba3a0">in production</text>
    </g>

    <rect x="0.5" y="0.5" width="579" height="209" rx="13" fill="none" stroke="#1c3333" stroke-width="1" class="edge"/>
    <rect x="0" y="0" width="3" height="210" fill="#2dd4bf" class="rail"/>
  </g>
</svg>
