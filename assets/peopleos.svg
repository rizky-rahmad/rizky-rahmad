<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" role="img" aria-label="HR app (PeopleOS): one HR app for hiring, training, scheduling, GPS clock-in and leave. 154 employees use it on web and Android. Team project; I work on the mobile app, leave and approvals.">
  <style>
    .p-t{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
    .p-run{stroke-dasharray:488;stroke-dashoffset:488;animation:p-run 7.5s linear infinite}
    .p-n{animation:p-n 7.5s infinite}
    .p-n2{animation-delay:1.25s}.p-n3{animation-delay:2.5s}.p-n4{animation-delay:3.75s}.p-n5{animation-delay:5s}
    @keyframes p-run{0%{stroke-dashoffset:488}67%,90%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
    @keyframes p-n{0%{fill:#2a1d07;stroke:#f59e0b}6%{fill:#f59e0b}30%,100%{fill:#1a1408;stroke:#5c4313}}
    @media (prefers-reduced-motion:reduce){.p-run{animation:none;stroke-dashoffset:0}.p-n{animation:none}}
  </style>
  <rect width="640" height="340" rx="16" fill="#0d1520" stroke="#1e2a38"/>
  <text x="28" y="48" class="p-t" font-size="26" font-weight="700" fill="#f8fafc">HR app</text>
  <text x="612" y="46" class="p-t" font-size="14" fill="#64748b" text-anchor="end">PeopleOS</text>
  <text x="28" y="76" class="p-t" font-size="16" fill="#9fb0c3">Every employee, from first interview to last shift.</text>

  <line x1="76" y1="160" x2="564" y2="160" stroke="#2a2416" stroke-width="3"/>
  <line x1="76" y1="160" x2="564" y2="160" stroke="#f59e0b" stroke-width="3" class="p-run"/>

  <g stroke-width="2">
    <circle cx="76" cy="160" r="30" fill="#1a1408" stroke="#5c4313" class="p-n"/>
    <circle cx="198" cy="160" r="30" fill="#1a1408" stroke="#5c4313" class="p-n p-n2"/>
    <circle cx="320" cy="160" r="30" fill="#1a1408" stroke="#5c4313" class="p-n p-n3"/>
    <circle cx="442" cy="160" r="30" fill="#1a1408" stroke="#5c4313" class="p-n p-n4"/>
    <circle cx="564" cy="160" r="30" fill="#1a1408" stroke="#5c4313" class="p-n p-n5"/>
  </g>
  <!-- icons -->
  <g fill="none" stroke="#fde68a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="72" cy="153" r="6"/><path d="M61 172 c2-7 7-10 11-10 s9 3 11 10"/><path d="M86 150 v10 M81 155 h10"/>
    <path d="M192 148 l16 12 l-16 12 z"/>
    <rect x="306" y="148" width="28" height="25" rx="4"/><path d="M306 156 h28 M313 144 v7 M327 144 v7"/>
    <path d="M442 176 c-8-9-12-15-12-20 a12 12 0 0 1 24 0 c0 5-4 11-12 20z"/><circle cx="442" cy="156" r="4"/>
    <circle cx="564" cy="160" r="7"/><path d="M564 143 v4 M564 173 v4 M547 160 h4 M577 160 h4 M552 148 l3 3 M573 169 l3 3 M576 148 l-3 3 M555 169 l-3 3"/>
  </g>
  <g class="p-t" font-size="15" fill="#e2e8f0" text-anchor="middle">
    <text x="76" y="216">Hire</text><text x="198" y="216">Train</text><text x="320" y="216">Schedule</text><text x="442" y="216">Clock in</text><text x="564" y="216">Leave</text>
  </g>
  <text x="76" y="236" class="p-t" font-size="13" fill="#64748b" text-anchor="middle">AI-scored</text>
  <text x="442" y="236" class="p-t" font-size="13" fill="#64748b" text-anchor="middle">GPS + selfie</text>

  <line x1="28" y1="252" x2="612" y2="252" stroke="#1e2a38"/>
  <text x="28" y="282" class="p-t" font-size="15" fill="#cbd5e1"><tspan font-size="22" font-weight="700" fill="#f59e0b">154</tspan>  employees · web + Android</text>
  <text x="28" y="308" class="p-t" font-size="15" fill="#e2e8f0">Team project · <tspan fill="#f59e0b">my part: mobile app, leave &amp; approvals</tspan></text>
  <text x="28" y="328" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#64748b">React · Express · Drizzle · Postgres · Expo</text>
</svg>
