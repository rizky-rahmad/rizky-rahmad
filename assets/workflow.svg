<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 210" width="1200" height="210" role="img" aria-label="A terminal session: measuring before optimising, finding the largest contentful paint was waiting on a CSS animation">
  <title>How a debugging session actually goes</title>

  <defs>
    <linearGradient id="tbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f14"/>
      <stop offset="100%" stop-color="#0a1414"/>
    </linearGradient>
    <clipPath id="tcard"><rect width="1200" height="210" rx="14"/></clipPath>

    <style>
      /* Lines arrive in sequence, the way they would in a real session. */
      .l1 { opacity: 0; animation: show 12s linear infinite; animation-delay: 0.4s; }
      .l2 { opacity: 0; animation: show 12s linear infinite; animation-delay: 2.2s; }
      .l3 { opacity: 0; animation: show 12s linear infinite; animation-delay: 4.0s; }
      .l4 { opacity: 0; animation: show 12s linear infinite; animation-delay: 5.8s; }
      .l5 { opacity: 0; animation: show 12s linear infinite; animation-delay: 7.6s; }
      .caret { animation: blink 1s steps(1) infinite; }
      .dot   { animation: beat 2.2s ease-in-out infinite; }

      @keyframes show { 0% { opacity: 0; } 3% { opacity: 1; } 88% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
      @keyframes beat { 0%,100% { opacity: .3; } 50% { opacity: 1; } }

      @media (prefers-reduced-motion: reduce) {
        .l1,.l2,.l3,.l4,.l5 { opacity: 1; animation: none; }
        .caret,.dot { animation: none; }
      }
    </style>
  </defs>

  <g clip-path="url(#tcard)">
    <rect width="1200" height="210" fill="url(#tbg)"/>

    <!-- title bar -->
    <rect width="1200" height="38" fill="#0d151a"/>
    <line x1="0" y1="38" x2="1200" y2="38" stroke="#1c3333"/>
    <g>
      <circle cx="26" cy="19" r="5" fill="#2a3a3a"/>
      <circle cx="46" cy="19" r="5" fill="#2a3a3a"/>
      <circle cx="66" cy="19" r="5" fill="#2a3a3a"/>
    </g>
    <text x="92" y="24" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#4d7070" letter-spacing="1">claude-code &#8212; portfolio</text>
    <circle cx="1168" cy="19" r="4" fill="#2dd4bf" class="dot"/>

    <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14.5">
      <text x="28" y="72" class="l1">
        <tspan fill="#2dd4bf">&#8250;</tspan><tspan fill="#cfe9e6">&#160;the chatbot is slow. find out why before changing anything</tspan>
      </text>
      <text x="28" y="102" class="l2" fill="#5f8585">
        &#160;&#160;measured: transfer 2.2MB <tspan fill="#4d7070">&#8594;</tspan> 2.2s&#160;&#160;&#124;&#160;&#160;model reading the scans <tspan fill="#4d7070">&#8594;</tspan> <tspan fill="#e6a23c">38s</tspan>
      </text>
      <text x="28" y="132" class="l3" fill="#5f8585">
        &#160;&#160;the payload was never the problem. <tspan fill="#7fe9dc">the repeated reading was.</tspan>
      </text>
      <text x="28" y="162" class="l4">
        <tspan fill="#2dd4bf">&#8250;</tspan><tspan fill="#cfe9e6">&#160;then LCP is still 3.5s on mobile, and desktop is fine</tspan>
      </text>
      <text x="28" y="192" class="l5" fill="#5f8585">
        &#160;&#160;LCP breakdown: render delay 1230ms <tspan fill="#4d7070">&#8212;</tspan> <tspan fill="#7fe9dc">it was waiting on our own CSS fade</tspan><tspan fill="#2dd4bf" class="caret">&#160;&#9608;</tspan>
      </text>
    </g>

    <rect x="0.5" y="0.5" width="1199" height="209" rx="14" fill="none" stroke="#1c3333"/>
    <rect x="0" y="0" width="3" height="210" fill="#2dd4bf"/>
  </g>
</svg>
