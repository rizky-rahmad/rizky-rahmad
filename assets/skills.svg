<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-label="Stack: frontend React, Next.js, TypeScript, Tailwind; backend Node.js, Express, NestJS, REST, JWT and OAuth 2.0; data PostgreSQL, Redis, Supabase; AI Gemini, OpenAI, prompt design, document retrieval; infra Cloudflare, Vercel, Azure Functions, GitHub Actions, Docker">
  <title>What I work with</title>

  <defs>
    <linearGradient id="sbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#0a1414"/>
    </linearGradient>
    <linearGradient id="chipFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#132028"/>
      <stop offset="100%" stop-color="#0c161b"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0"/>
      <stop offset="50%" stop-color="#2dd4bf" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </linearGradient>
    <pattern id="sgrid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" fill="none" stroke="#2dd4bf" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <clipPath id="scard"><rect width="1200" height="330" rx="14"/></clipPath>

    <style>
      /* Rows wake one after another, then the whole card holds before repeating,
         so it reads as a system coming online rather than a flicker. */
      .r1 { animation: wake 14s ease-out infinite; }
      .r2 { animation: wake 14s ease-out infinite; animation-delay: .55s; }
      .r3 { animation: wake 14s ease-out infinite; animation-delay: 1.1s; }
      .r4 { animation: wake 14s ease-out infinite; animation-delay: 1.65s; }
      .r5 { animation: wake 14s ease-out infinite; animation-delay: 2.2s; }

      .led   { animation: led 3.4s ease-in-out infinite; }
      .led2  { animation: led 3.4s ease-in-out infinite; animation-delay: .7s; }
      .led3  { animation: led 3.4s ease-in-out infinite; animation-delay: 1.4s; }
      .led4  { animation: led 3.4s ease-in-out infinite; animation-delay: 2.1s; }
      .led5  { animation: led 3.4s ease-in-out infinite; animation-delay: 2.8s; }
      .sweep { animation: sweep 14s ease-in-out infinite; }

      @keyframes wake {
        0%   { opacity: 0; transform: translateX(-10px); }
        4%   { opacity: 1; transform: translateX(0); }
        92%  { opacity: 1; transform: translateX(0); }
        100% { opacity: 0; transform: translateX(0); }
      }
      @keyframes led   { 0%,100% { opacity:.3; } 50% { opacity:1; } }
      @keyframes sweep { 0%,100% { transform: translateY(-40px); } 50% { transform: translateY(370px); } }

      @media (prefers-reduced-motion: reduce) {
        .r1,.r2,.r3,.r4,.r5 { opacity: 1; transform: none; animation: none; }
        .led,.led2,.led3,.led4,.led5,.sweep { animation: none; }
      }
    </style>
  </defs>

  <g clip-path="url(#scard)">
    <rect width="1200" height="330" fill="url(#sbg)"/>
    <rect width="1200" height="330" fill="url(#sgrid)"/>

    <!-- a slow horizontal band travelling down the card -->
    <g class="sweep"><rect x="0" y="0" width="1200" height="60" fill="url(#scan)"/></g>

    <text x="34" y="40" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#7ba3a0" letter-spacing="2.4">STACK</text>
    <line x1="34" y1="54" x2="1166" y2="54" stroke="#1c3333"/>

    <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5">

      <g class="r1">
        <circle cx="42" cy="86" r="4" fill="#2dd4bf" class="led"/>
        <text x="60" y="91" fill="#8fb5b1">FRONTEND</text>
        <g transform="translate(210, 72)">
          <g><rect width="94" height="28" rx="7" fill="url(#chipFill)" stroke="#1c3333"/><text x="47" y="19" text-anchor="middle" fill="#cfe9e6">React</text></g>
          <g transform="translate(104,0)"><rect width="104" height="28" rx="7" fill="url(#chipFill)" stroke="#1c3333"/><text x="52" y="19" text-anchor="middle" fill="#cfe9e6">Next.js</text></g>
          <g transform="translate(218,0)"><rect width="124" height="28" rx="7" fill="url(#chipFill)" stroke="#1c3333"/><text x="62" y="19" text-anchor="middle" fill="#cfe9e6">TypeScript</text></g>
          <g transform="translate(352,0)"><rect width="118" height="28" rx="7" fill="url(#chipFill)" stroke="#1c3333"/><text x="59" y="19" text-anchor="middle" fill="#cfe9e6">Tailwind</text></g>
          <g transform="translate(480,0)"><rect width="132" height="28" rx="7" fill="url(#chipFill)" stroke="#1c3333"/><text x="66" y="19" text-anchor="middle" fill="#cfe9e6">Radix / shadcn</text></g>
        </g>
      </g>

      <g class="r2">
        <circle cx="42" cy="134" r="4" fill="#2dd4bf" class="led2"/>
        <text x="60" y="139" fill="#8fb5b1">BACKEND</text>
        <g transform="translate(210, 120)">
          <g><rect width="104" height="28" rx="7" fill="url(#chipFill)" stroke="#1c3333"/><text x="52" y="19" text-anchor="middle" fill="#cfe9e6">Node.js</text></g>
          <g transform="translate(114,0)"><rect width="104" height="28" rx="7" fill="url(#chipFill)" stroke="#1c3333"/><text x="52" y="19" text-anchor="middle" fill="#cfe9e6">Express</text></g>
          <g transform="translate(228,0)"><rect width="100" height="28" rx="7" fill="url(#chipFill)" stroke="#1c3333"/><text x="50" y="19" text-anchor="middle" fill="#cfe9e6">NestJS</text></g>
          <g transform="translate(338,0)"><rect width="118" height="28" rx="7" fill="url(#chipFill)" stroke="#1c3333"/><text x="59" y="19" text-anchor="middle" fill="#cfe9e6">REST APIs</text></g>
          <g transform="translate(466,0)"><rect width="152" height="28" rx="7" fill="url(#chipFill)" stroke="#1c3333"/><text x="76" y="19" text-anchor="middle" fill="#cfe9e6">JWT / OAuth 2.0</text></g>
        </g>
      </g>

      <g class="r3">
        <circle cx="42" cy="182" r="4" fill="#22d3ee" class="led3"/>
        <text x="60" y="187" fill="#8fb5b1">DATA</text>
        <g transform="translate(210, 168)">
          <g><rect width="128" height="28" rx="7" fill="url(#chipFill)" stroke="#1c3333"/><text x="64" y="19" text-anchor="middle" fill="#cfe9e6">PostgreSQL</text></g>
          <g transform="translate(138,0)"><rect width="86" height="28" rx="7" fill="url(#chipFill)" stroke="#1c3333"/><text x="43" y="19" text-anchor="middle" fill="#cfe9e6">Redis</text></g>
          <g transform="translate(234,0)"><rect width="112" height="28" rx="7" fill="url(#chipFill)" stroke="#1c3333"/><text x="56" y="19" text-anchor="middle" fill="#cfe9e6">Supabase</text></g>
          <g transform="translate(356,0)"><rect width="196" height="28" rx="7" fill="url(#chipFill)" stroke="#1c3333"/><text x="98" y="19" text-anchor="middle" fill="#8fb5b1">schema design, tuning</text></g>
        </g>
      </g>

      <g class="r4">
        <circle cx="42" cy="230" r="4" fill="#22d3ee" class="led4"/>
        <text x="60" y="235" fill="#8fb5b1">AI</text>
        <g transform="translate(210, 216)">
          <g><rect width="94" height="28" rx="7" fill="url(#chipFill)" stroke="#1c3333"/><text x="47" y="19" text-anchor="middle" fill="#cfe9e6">Gemini</text></g>
          <g transform="translate(104,0)"><rect width="98" height="28" rx="7" fill="url(#chipFill)" stroke="#1c3333"/><text x="49" y="19" text-anchor="middle" fill="#cfe9e6">OpenAI</text></g>
          <g transform="translate(212,0)"><rect width="136" height="28" rx="7" fill="url(#chipFill)" stroke="#1c3333"/><text x="68" y="19" text-anchor="middle" fill="#cfe9e6">prompt design</text></g>
          <g transform="translate(358,0)"><rect width="206" height="28" rx="7" fill="url(#chipFill)" stroke="#1c3333"/><text x="103" y="19" text-anchor="middle" fill="#cfe9e6">retrieval over real docs</text></g>
        </g>
      </g>

      <g class="r5">
        <circle cx="42" cy="278" r="4" fill="#2dd4bf" class="led5"/>
        <text x="60" y="283" fill="#8fb5b1">INFRA</text>
        <g transform="translate(210, 264)">
          <g><rect width="112" height="28" rx="7" fill="url(#chipFill)" stroke="#1c3333"/><text x="56" y="19" text-anchor="middle" fill="#cfe9e6">Cloudflare</text></g>
          <g transform="translate(122,0)"><rect width="86" height="28" rx="7" fill="url(#chipFill)" stroke="#1c3333"/><text x="43" y="19" text-anchor="middle" fill="#cfe9e6">Vercel</text></g>
          <g transform="translate(218,0)"><rect width="146" height="28" rx="7" fill="url(#chipFill)" stroke="#1c3333"/><text x="73" y="19" text-anchor="middle" fill="#cfe9e6">Azure Functions</text></g>
          <g transform="translate(374,0)"><rect width="140" height="28" rx="7" fill="url(#chipFill)" stroke="#1c3333"/><text x="70" y="19" text-anchor="middle" fill="#cfe9e6">GitHub Actions</text></g>
          <g transform="translate(524,0)"><rect width="90" height="28" rx="7" fill="url(#chipFill)" stroke="#1c3333"/><text x="45" y="19" text-anchor="middle" fill="#cfe9e6">Docker</text></g>
        </g>
      </g>
    </g>

    <text x="1166" y="40" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#2dd4bf" opacity="0.8">AZURE AI FUNDAMENTALS &#183; AI-900</text>

    <rect x="0.5" y="0.5" width="1199" height="329" rx="14" fill="none" stroke="#1c3333"/>
    <rect x="0" y="0" width="3" height="330" fill="#2dd4bf"/>
  </g>
</svg>
